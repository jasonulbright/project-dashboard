name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    # A pull request from a branch of this repository is already covered by its push run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults

      # A run whose suite silently collects nothing exits 0.
      - name: Verify test tally
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse
          if (-not $trx) { throw 'No .trx produced by the test run.' }
          $total = 0
          foreach ($file in $trx) {
            $counters = ([xml](Get-Content -LiteralPath $file.FullName -Raw)).TestRun.ResultSummary.Counters
            $fileTotal    = [int] $counters.total
            $fileExecuted = [int] $counters.executed
            $failed       = [int] $counters.failed
            $errored      = [int] $counters.error + [int] $counters.timeout + [int] $counters.aborted + [int] $counters.inconclusive
            $skipped      = $fileTotal - $fileExecuted
            Write-Host "$($file.Name): total $fileTotal, executed $fileExecuted, failed $failed, errored $errored."
            if ($fileTotal -eq 0) { throw "$($file.Name) collected no tests." }
            if ($failed -ne 0) { throw "$failed test(s) failed in $($file.Name)." }
            if ($errored -ne 0) { throw "$errored test(s) errored in $($file.Name)." }
            if ($skipped -ne 0) { throw "$skipped test(s) did not execute in $($file.Name)." }
            $total += $fileTotal
          }
          Write-Host "Total $total across $($trx.Count) result file(s)."

      - name: Upload test results
        if: always() && hashFiles('TestResults/*.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: error
