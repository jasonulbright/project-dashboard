name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify every step except publishing the release.
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A published release is never rewritten, so every disagreement between the tag,
      # the assembly version, the packaged version, and the changelog has to fail before
      # the first build step. Each check reads a file already in the checkout.
      - name: Resolve version
        run: |
          $projectFile = 'src/ProjectDashboard/ProjectDashboard.csproj'
          $nsiFile     = 'installer/project-dashboard.nsi'

          $projectVersion = ([xml](Get-Content -LiteralPath $projectFile -Raw)).
            SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()

          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
              throw "Tag '${{ github.ref_name }}' is not a version tag."
            }
            if ($projectVersion -ne $version) {
              throw "Tag says $version, $projectFile says $projectVersion."
            }
          }
          else {
            $version = $projectVersion
            if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
              throw "$projectFile says '$projectVersion', which is not a version."
            }
          }

          $nsiText = Get-Content -LiteralPath $nsiFile -Raw
          if ($nsiText -notmatch '(?m)^\s*!define\s+VERSION\s+"([^"]+)"') {
            throw "No !define VERSION found in $nsiFile."
          }
          $nsiVersion = $Matches[1]
          if ($nsiVersion -ne $version) {
            throw "Version is $version, $nsiFile says $nsiVersion."
          }

          # The notes live in the runner temp directory: .gitignore covers every path the
          # build writes inside the checkout, and an extra file there is not.
          $notes = "$env:RUNNER_TEMP/release-notes.md"
          pwsh -File installer/extract-changelog.ps1 -Version $version -OutputPath $notes
          if ($LASTEXITCODE -ne 0) { throw "extract-changelog.ps1 failed with exit code $LASTEXITCODE." }

          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Verify test tally
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse
          if (-not $trx) { throw 'No .trx produced by the test run.' }
          $total = 0
          foreach ($file in $trx) {
            $counters = ([xml](Get-Content -LiteralPath $file.FullName -Raw)).TestRun.ResultSummary.Counters
            $fileTotal    = [int] $counters.total
            $fileExecuted = [int] $counters.executed
            $failed       = [int] $counters.failed
            $errored      = [int] $counters.error + [int] $counters.timeout + [int] $counters.aborted + [int] $counters.inconclusive
            $skipped      = $fileTotal - $fileExecuted
            Write-Host "$($file.Name): total $fileTotal, executed $fileExecuted, failed $failed, errored $errored."
            if ($fileTotal -eq 0) { throw "$($file.Name) collected no tests." }
            if ($failed -ne 0) { throw "$failed test(s) failed in $($file.Name)." }
            if ($errored -ne 0) { throw "$errored test(s) errored in $($file.Name)." }
            if ($skipped -ne 0) { throw "$skipped test(s) did not execute in $($file.Name)." }
            $total += $fileTotal
          }
          Write-Host "Total $total across $($trx.Count) result file(s)."

      # build-portable.ps1 publishes into installer\payload, which is exactly what the
      # installer script packs, so the portable archive is built before makensis runs.
      - name: Build portable archive
        run: pwsh -File installer/build-portable.ps1

      - name: Resolve makensis
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            $onPath = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $onPath) {
              choco install nsis --no-progress --yes
              if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed with exit code $LASTEXITCODE." }
              # The installer edits the machine PATH; this process keeps the one it started with.
              $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
              $onPath = Get-Command makensis -ErrorAction SilentlyContinue
            }
            if ($onPath) { $makensis = $onPath.Source }
          }
          if (-not (Test-Path -LiteralPath $makensis)) { throw 'makensis.exe not found after install.' }
          "MAKENSIS=$makensis" >> $env:GITHUB_ENV

      - name: Build installer
        working-directory: installer
        run: |
          & $env:MAKENSIS project-dashboard.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE." }

      # Assets are named explicitly: a wildcard would attach any stale artifact left in
      # the tree by an earlier step.
      - name: Publish release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = "installer/ProjectDashboard-Setup-$env:VERSION.exe"
          $portable  = "installer/ProjectDashboard-Portable-$env:VERSION.zip"
          foreach ($asset in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset." }
          }
          gh release create '${{ github.ref_name }}' `
            --verify-tag `
            --title "Project Dashboard $env:VERSION" `
            --notes-file $env:RELEASE_NOTES `
            $installer $portable
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
